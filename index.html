<!DOCTYPE html>
<html lang="ja">
<head>

  <meta charset="UTF-8" />

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
  />

  <title>shin.pw</title>

  <!-- Google Font -->

  <link rel="preconnect" href="https://fonts.googleapis.com">

  <link
    rel="preconnect"
    href="https://fonts.gstatic.com"
    crossorigin
  >

  <link
    href="https://fonts.googleapis.com/css2?family=Potta+One&display=swap"
    rel="stylesheet"
  >

  <style>

    :root {

      --bg: #070707;
      --bg2: #111114;

      --text: #f5f5f5;
    }

    * {

      margin: 0;
      padding: 0;

      box-sizing: border-box;

      -webkit-tap-highlight-color:
        transparent;
    }

    html {

      height: 100dvh;
    }

    html,
    body {

      width: 100%;

      overflow: hidden;

      background:
        linear-gradient(
          135deg,
          var(--bg),
          var(--bg2)
        );

      color: var(--text);

      font-family:
        "Potta One",
        system-ui,
        sans-serif;

      -webkit-font-smoothing:
        antialiased;

      text-rendering:
        optimizeLegibility;
    }

    body {

      position: relative;

      display: flex;

      justify-content: center;
      align-items: center;

      height: 100dvh;

      overflow: hidden;
    }

    /* subtle animated grid */

    body::before {

      content: "";

      position: absolute;

      inset: 0;

      background-image:

        linear-gradient(
          rgba(255,255,255,0.022) 1px,
          transparent 1px
        ),

        linear-gradient(
          90deg,
          rgba(255,255,255,0.022) 1px,
          transparent 1px
        );

      background-size:
        42px 42px;

      mask-image:

        radial-gradient(
          circle at center,
          black 18%,
          transparent 75%
        );

      animation:
        gridMove 20s linear infinite;
    }

    @keyframes gridMove {

      from {
        transform: translate(0, 0);
      }

      to {
        transform: translate(-42px, -42px);
      }
    }

    /* main container */

    main {

      display: block;

      border: none;

      outline: none;
    }

    .scene {

      position: relative;

      z-index: 2;

      width: 100%;

      display: flex;

      flex-direction: column;

      justify-content: center;
      align-items: center;

      text-align: center;

      padding:
        env(safe-area-inset-top)
        20px
        env(safe-area-inset-bottom);
    }

    /* title */

    h1 {

      display: flex;

      justify-content: center;

      gap: 0.015em;

      line-height: 1;

      letter-spacing: -0.05em;

      user-select: none;

      font-size:
        clamp(3.2rem, 19vw, 6rem);
    }

    h1 span {

      display: inline-block;

      opacity: 0;

      transform:

        translateY(-260px)

        scaleY(1.2)

        scaleX(0.9);

      animation:

        titleBounce 1.25s
        cubic-bezier(.22,1,.36,1)
        forwards;
    }

    h1 span:nth-child(1) {
      animation-delay: 0s;
    }

    h1 span:nth-child(2) {
      animation-delay: 0.08s;
    }

    h1 span:nth-child(3) {
      animation-delay: 0.16s;
    }

    h1 span:nth-child(4) {
      animation-delay: 0.24s;
    }

    h1 span:nth-child(5) {
      animation-delay: 0.32s;
    }

    h1 span:nth-child(6) {
      animation-delay: 0.40s;
    }

    h1 span:nth-child(7) {
      animation-delay: 0.48s;
    }

    @keyframes titleBounce {

      0% {

        opacity: 0;

        transform:

          translateY(-260px)

          scaleY(1.15)

          scaleX(0.9);
      }

      55% {

        opacity: 1;

        transform:

          translateY(0)

          scaleY(0.82)

          scaleX(1.08);
      }

      72% {

        transform:

          translateY(-38px)

          scaleY(1.05)

          scaleX(0.97);
      }

      84% {

        transform:

          translateY(0)

          scaleY(0.92)

          scaleX(1.03);
      }

      92% {

        transform:

          translateY(-10px)

          scaleY(1.02)

          scaleX(0.98);
      }

      100% {

        opacity: 1;

        transform:

          translateY(0)

          scale(1);
      }
    }

    /* underline */

    .underline {

      width: 0;

      height: 2px;

      margin-top: 16px;

      border-radius: 999px;

      background:

        linear-gradient(
          90deg,
          transparent,
          rgba(255,255,255,0.9),
          transparent
        );

      animation:
        lineExpand 1.1s ease forwards;

      animation-delay: .9s;
    }

    @keyframes lineExpand {

      to {
        width: min(72vw, 320px);
      }
    }

    /* emoji */

    .emoji-group {

      position: relative;

      width: 240px;

      height: 72px;

      margin-top: 28px;
    }

    .emoji {

      position: absolute;

      left: 50%;
      top: 50%;

      width: 32px;
      height: 32px;

      margin-left: -16px;
      margin-top: -16px;

      display: flex;

      justify-content: center;
      align-items: center;

      font-size:
        clamp(1.8rem, 8vw, 2.4rem);

      opacity: 0;

      filter:
        drop-shadow(
          0 0 10px
          rgba(255,255,255,0.14)
        );
    }

    .emoji:nth-child(1) {
      animation:
        fly1 1.8s cubic-bezier(.18,1,.32,1) forwards;
      animation-delay: 1s;
    }

    .emoji:nth-child(2) {
      animation:
        fly2 1.9s cubic-bezier(.18,1,.32,1) forwards;
      animation-delay: 1.1s;
    }

    .emoji:nth-child(3) {
      animation:
        fly3 1.7s cubic-bezier(.18,1,.32,1) forwards;
      animation-delay: 1.2s;
    }

    .emoji:nth-child(4) {
      animation:
        fly4 1.9s cubic-bezier(.18,1,.32,1) forwards;
      animation-delay: 1.3s;
    }

    .emoji:nth-child(5) {
      animation:
        fly5 1.8s cubic-bezier(.18,1,.32,1) forwards;
      animation-delay: 1.4s;
    }

    @keyframes fly1 {

      0% {

        opacity: 0;

        transform:
          translate(-320px,-220px)
          rotate(-180deg)
          scale(.2);
      }

      72% {

        opacity: 1;

        transform:
          translate(-70px,-10px)
          rotate(25deg)
          scale(1.15);
      }

      100% {

        opacity: 1;

        transform:
          translate(-100px,0)
          rotate(0)
          scale(1);
      }
    }

    @keyframes fly2 {

      0% {

        opacity: 0;

        transform:
          translate(300px,-180px)
          rotate(180deg)
          scale(.2);
      }

      72% {

        opacity: 1;

        transform:
          translate(-10px,-14px)
          rotate(-18deg)
          scale(1.18);
      }

      100% {

        opacity: 1;

        transform:
          translate(-50px,0)
          rotate(0)
          scale(1);
      }
    }

    @keyframes fly3 {

      0% {

        opacity: 0;

        transform:
          translate(-260px,220px)
          rotate(-220deg)
          scale(.2);
      }

      72% {

        opacity: 1;

        transform:
          translate(0,18px)
          rotate(18deg)
          scale(1.12);
      }

      100% {

        opacity: 1;

        transform:
          translate(0,0)
          rotate(0)
          scale(1);
      }
    }

    @keyframes fly4 {

      0% {

        opacity: 0;

        transform:
          translate(280px,240px)
          rotate(200deg)
          scale(.2);
      }

      72% {

        opacity: 1;

        transform:
          translate(34px,-14px)
          rotate(-20deg)
          scale(1.18);
      }

      100% {

        opacity: 1;

        transform:
          translate(50px,0)
          rotate(0)
          scale(1);
      }
    }

    @keyframes fly5 {

      0% {

        opacity: 0;

        transform:
          translate(0,-320px)
          rotate(360deg)
          scale(.2);
      }

      72% {

        opacity: 1;

        transform:
          translate(0,-18px)
          rotate(-20deg)
          scale(1.2);
      }

      100% {

        opacity: 1;

        transform:
          translate(100px,0)
          rotate(0)
          scale(1);
      }
    }

    /* glow */

    .glow {

      position: absolute;

      width: 320px;
      height: 320px;

      border-radius: 50%;

      background:

        radial-gradient(
          circle,
          rgba(255,255,255,0.06),
          transparent 72%
        );

      pointer-events: none;

      transform:
        translate(-50%, -50%);

      z-index: 1;
    }

    /* mobile */

    @media (max-width: 480px) {

      .emoji-group {

        width: 210px;

        height: 60px;
      }
    }

  </style>

</head>

<body>

  <div
    class="glow"
    id="glow"
  ></div>

  <main
    class="scene"
    id="scene"
  >

    <h1>

      <span>s</span>
      <span>h</span>
      <span>i</span>
      <span>n</span>
      <span>.</span>
      <span>p</span>
      <span>w</span>

    </h1>

    <div
      class="underline"
      id="underline"
    ></div>

    <div
      class="emoji-group"
      id="emojiGroup"
    >

      <div class="emoji">🙂</div>
      <div class="emoji">🙂</div>
      <div class="emoji">🙂</div>
      <div class="emoji">🙂</div>
      <div class="emoji">🙂</div>

    </div>

  </main>

  <script>

    /* glow */

    const glow =
      document.getElementById('glow');

    window.addEventListener(
      'pointermove',
      (e) => {

        glow.style.left =
          e.clientX + 'px';

        glow.style.top =
          e.clientY + 'px';
      }
    );

    /* replay animation */

    function replayAnimation() {

      const spans =
        document.querySelectorAll('h1 span');

      const emojis =
        document.querySelectorAll('.emoji');

      const underline =
        document.getElementById('underline');

      spans.forEach((el) => {
        el.style.animation = 'none';
      });

      emojis.forEach((el) => {
        el.style.animation = 'none';
      });

      underline.style.animation =
        'none';

      void document.body.offsetWidth;

      spans.forEach((el, index) => {

        el.style.animation =
          `titleBounce 1.25s cubic-bezier(.22,1,.36,1) forwards`;

        el.style.animationDelay =
          `${index * 0.08}s`;
      });

      const flyAnimations = [
        'fly1',
        'fly2',
        'fly3',
        'fly4',
        'fly5'
      ];

      emojis.forEach((el, index) => {

        el.style.animation =
          `${flyAnimations[index]} 1.8s cubic-bezier(.18,1,.32,1) forwards`;

        el.style.animationDelay =
          `${1 + index * 0.1}s`;
      });

      underline.style.animation =
        `lineExpand 1.1s ease forwards`;

      underline.style.animationDelay =
        `0.9s`;
    }

    /* tap anywhere */

    document.addEventListener(
      'pointerdown',
      replayAnimation
    );

  </script>

</body>
</html>
